version: "3"

services:
  spiderfoot:
    environment:
      - NMAP_PRIVILEGED=true
      #- SPIDERFOOT_JSON_STRING={"sfp_abuseipdb:api_key":"example"}
    cap_add:
    - CAP_NET_RAW
    - CAP_NET_ADMIN
    - CAP_NET_BIND_SERVICE
    image: spiderfoot
    ports:
      - "5001:5001"
    restart: unless-stopped
    container_name: spiderfoot
    volumes:
      - ./spiderfoot-data:/var/lib/spiderfoot
      #-  /opt/spiderfoot/home/.spiderfoot:/home/spiderfoot/.spiderfoot
    build:
      context: ./
      dockerfile: ./Dockerfile.kost

